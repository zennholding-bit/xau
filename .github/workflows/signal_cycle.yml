name: Signal Cycle

# Kör hela pipelinen: hämta marknadsdata -> teknisk analys -> signal -> paper trading.
# GitHub Actions cron är UTC. Var 5:e minut - snabbaste intervall GitHub Actions
# tillåter för schemalagda jobb. XAU/USD analyseras på 5-minuters candles via
# Twelve Data (fungerar på free tier, ~288 anrop/dag av 800 tillåtna).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # gör att du kan trigga manuellt från GitHub UI

jobs:
  run-signal-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera dependencies
        run: pip install -r requirements.txt

      - name: Kör signal-cykeln
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_PROVIDER: "none"
        run: python -m engine.signal_engine.run_signal_cycle
