name: BTC Signal Cycle

# Samma pipeline som signal_cycle.yml men för BTC/USD.
# 2026-08-20: satt till samma 5-minuters-cadence som XAU (GitHub Actions
# tillåter inte tätare schemaläggning än var 5:e minut - kortare intervall
# (*/2, */3 etc) tystas bort och körs aldrig alls, det är en hård
# plattformsspärr, inte en fråga om minutbudget). Med båda på 5 min:
# 288 (XAU) + 288 (BTC) + ~11 (daglig cross-market-ingestion) = ~587 av
# Twelve Datas 800 anrop/dag - fortfarande god marginal.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run-btc-signal-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera dependencies
        run: pip install -r requirements.txt

      - name: Kör BTC signal-cykeln
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_PROVIDER: "none"
        run: python -m engine.signal_engine.run_signal_cycle BTCUSD

