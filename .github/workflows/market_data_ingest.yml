name: Market Data Ingest

# Hämtar bredare historik för alla symboler/timeframes (inte bara de som
# behövs för själva signalen). Körs mer sällan än signal-cykeln.
on:
  schedule:
    - cron: "0 * * * *"   # varje timme
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera dependencies
        run: pip install -r requirements.txt

      - name: Kör marknadsdata-ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m engine.data_ingestion.market_data.run_ingest
