name: Market Data Ingest

# Hämtar historik för alla symboler (Twelve Data, dagsdata). Körs en gång per
# dag - ny data publiceras ändå bara en gång per handelsdag.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera dependencies
        run: pip install -r requirements.txt

      - name: Kör marknadsdata-ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -m engine.data_ingestion.market_data.run_ingest
